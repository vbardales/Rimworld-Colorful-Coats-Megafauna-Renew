<!doctype html><meta charset="utf-8">
<!--
  Engraving page for Mod/About/Preview.png, per STYLE_RIMWORLD.md.

  Rasterised with headless Chrome at 896x504, so the glyphs are composed at final size and never
  resampled. The background is Preview-source.png at full resolution, scaled and cropped here
  rather than beforehand: starting from an already-reduced Preview.png would resample the picture
  twice.

    chrome --headless --disable-gpu --screenshot=Mod/About/Preview.png \
           --window-size=896,504 --hide-scrollbars Art/preview.html

  The source is 1536x1024, which is 3:2, so 160 source pixels of height have to go. The crop is
  centred: taking it all off the bottom would cut the feet of the nearest mammoth, and taking it
  all off the top would eat the dark corner the title sits in.

  The count is engraved: 26 animals is a number that cannot move. The source mod stopped at 1.4
  and the patch names its 26 defNames one by one, so nothing outside this repository can change
  it. See the rule in STYLE_RIMWORLD.md.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:896px; height:504px; overflow:hidden; background:#000; }
  .stage { position:relative; width:896px; height:504px;
           font-family:"Segoe UI",system-ui,sans-serif; }

  /* Centred crop, see above. The herd walks from the lower left to the upper right, so the
     diagonal survives either way; what does not survive is losing the feet. */
  .shot { position:absolute; inset:0; width:896px; height:504px;
          object-fit:cover; object-position:50% 50%; }

  /* Repository standard: radial darkening from the top-left, nil at 74%. It lands on the bare
     snow and the dark rocks above the settler, which is the calmest corner of the picture and
     the one the prompt reserved. */
  .veil { position:absolute; inset:0;
    background: radial-gradient(circle at 0% 0%, rgba(6,5,4,.86) 0%, rgba(6,5,4,0) 74%); }

  .text { position:absolute; left:56px; top:92px; width:430px; }
  h1 { font-size:40px; line-height:1.06; font-weight:700; color:#f2ece1;
       letter-spacing:-.5px; text-shadow:0 2px 10px rgba(0,0,0,.7); }
  .rule { width:58px; height:3px; background:#D68F2C; margin:22px 0 20px; }
  p { font-size:21px; line-height:1.42; color:#d8cfc0; text-shadow:0 1px 6px rgba(0,0,0,.75); }
</style>
<div class="stage">
  <img class="shot" src="Preview-source.png">
  <div class="veil"></div>
  <div class="text">
    <h1>Colorful Coats -<br>Megafauna! Renew</h1>
    <div class="rule"></div>
    <p>Coat variations for 26 prehistoric animals, so a mammoth herd is a herd of individuals.</p>
  </div>
</div>
