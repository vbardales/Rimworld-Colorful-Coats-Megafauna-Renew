<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Colorful Coats - Megafauna! Renew</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body,.stage { width:896px; height:504px; overflow:hidden; }
.stage { position:relative; font-family:"Segoe UI",system-ui,sans-serif; color:var(--inkPrimary); }
.shot { position:absolute; inset:0; width:896px; height:504px; object-fit:cover; object-position:50% 50%; }
/* Extended opacity protects the summary from bright snow. Palette comes only from JSON. */
.veil { position:absolute; inset:0; background:radial-gradient(ellipse 900px 680px at top left,rgb(var(--veilRGB) / .94) 0%,rgb(var(--veilRGB) / .90) 60%,rgb(var(--veilRGB) / 0) 100%); }
.text { position:absolute; left:50px; top:54px; width:460px; text-shadow:0 3px 10px rgb(0 0 0 / .75); }
h1 { font-size:46px; line-height:1.1; font-weight:600; letter-spacing:0; }
h1 .suffix { font-size:.65em; color:var(--inkSecondary); white-space:nowrap; }
.tag { font-size:24px; font-weight:400; line-height:1.1; letter-spacing:.2px; margin-top:8px; color:var(--inkSecondary); }
.rule { width:58px; height:3px; background:var(--accent); margin:20px 0 16px; }
.summary { width:430px; font-size:21px; font-weight:400; line-height:1.45; }
.badge { position:absolute; right:0; top:0; width:80px; height:80px; background:var(--accent); clip-path:polygon(0 0,100% 0,100% 100%); }
.version { position:absolute; left:869px; top:27px; transform:translate(-50%,-50%) rotate(45deg); font-size:26px; font-weight:700; line-height:1; color:var(--badgeInk); }
.background-only .text,.background-only .version { visibility:hidden; }
</style></head><body><main class="stage">
<img class="shot" src="Preview.png" alt="Mammoths with different coats crossing snowy ground"><div class="veil"></div>
<section class="text"><h1><span id="title-first">Colorful Coats -</span><br><span id="title-second">Megafauna!</span> <span class="suffix" id="suffix">Renew</span></h1>
<p class="tag" id="tag"></p><div class="rule"></div>
<p class="summary" id="summary">Coat variations for 26 prehistoric animals, so a mammoth herd is a herd of individuals.</p></section>
<div class="badge"></div><span class="version" id="version"></span></main>
<script>
window.previewReady = (async () => {
 const [palette, aboutText, status] = await Promise.all([fetch('preview-palette.json').then(r=>r.json()),fetch('../Mod/About/About.xml').then(r=>r.text()),fetch('../STATUS.md').then(r=>r.text())]);
 for(const [key,value] of Object.entries(palette)) document.documentElement.style.setProperty('--'+key,value);
 document.documentElement.style.setProperty('--veilRGB',palette.veil.slice(1).match(/../g).map(v=>parseInt(v,16)).join(' '));
 const about=new DOMParser().parseFromString(aboutText,'application/xml');
 const versions=[...about.querySelectorAll('supportedVersions > li')].map(n=>n.textContent.trim()).filter(v=>/^\d+\.\d+$/.test(v));
 versions.sort((a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);return y[0]-x[0]||y[1]-x[1];});
 if(!versions.length) throw new Error('No stable supported version');
 document.querySelector('#version').textContent=versions[0];
 const tag=document.querySelector('#tag');
 tag.textContent=/^visibility:\s*private\s*$/m.test(status)?'(prohibited)':/\(unofficial\)/.test(about.querySelector('name').textContent)?'(unofficial)':'';
 if(!tag.textContent) tag.remove();
 await document.fonts.ready; await document.querySelector('.shot').decode();
 return {palette,version:versions[0],tag:tag.textContent};
})();
</script></body></html>
